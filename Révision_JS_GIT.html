<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 10</title>
</head>
<body>

    <p id="message">Bonjour !</p>

    <button id="modifier">Modifier le contenu</button>

    <script>
        // Sélection des éléments HTML
        const msg = document.querySelector("#message");
        const btn = document.querySelector("#modifier");

        // Écoute du clic sur le bouton
        btn.addEventListener("click", function() {

            // Insère du HTML : le mot Bonjour sera affiché en gras
            msg.innerHTML = "<strong>Bonjour !</strong>";

        });
    </script>

</body>
</html>
