
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 29</title>
</head>
<body>

    <!--
    EXERCICE 29 - preventDefault()

    1. Sélectionne le formulaire avec querySelector().
    2. Ajoute un écouteur d'événement "submit".
    3. Récupère l'objet event dans la fonction.
    4. Empêche le comportement par défaut du formulaire.
    5. Affiche "Formulaire envoyé sans rechargement !" dans la console.

    Indice : event.preventDefault()
    -->

    <h1>Mon formulaire</h1>

    <form id="monFormulaire">
        <input type="text" placeholder="Ton prénom">
        <button type="submit">Envoyer</button>
    </form>

    <script>
        const form = document.querySelector("#monFormulaire")

        form.addEventListener("submit",function(event){
            event.preventDefault()
            console.log("Formulaire envoyé sans rechargement !")
        })
    </script>

</body>
</html>
