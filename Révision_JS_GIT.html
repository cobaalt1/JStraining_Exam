<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 21</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        #position {
            position: fixed;
            top: 10px;
            left: 10px;
            background: black;
            color: white;
            padding: 15px;
            border-radius: 8px;
        }

        .contenu {
            height: 2000px;
            padding-top: 100px;
        }
    </style>
</head>
<body>

    <p id="position">Position : 0</p>

    <div class="contenu">
        <h1>Fais défiler la page !</h1>
        <p>Observe la position du scroll.</p>
    </div>

    <script>
        // Sélectionne l'élément qui affichera la position
        const position = document.querySelector("#position");

        // Écoute les événements de défilement de la page
        window.addEventListener("scroll", function() {

            // Récupère la position verticale du défilement
            position.textContent = window.scrollY;

        });
    </script>

</body>
</html>
