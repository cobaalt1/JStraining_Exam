
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compteur interactif</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        #compteur {
            font-size: 50px;
            margin: 30px;
        }

        button {
            padding: 15px 25px;
            cursor: pointer;
        }

        .positif {
            color: green;
        }

        .negatif {
            color: red;
        }
    </style>
</head>
<body>

    <h1>Mon compteur</h1>

    <div id="compteur">0</div>

    <button id="moins">-</button>
    <button id="reset">Reset</button>
    <button id="plus">+</button>

    <script>
        /*
            EXERCICE 28 - COMPTEUR INTERACTIF

            1. Récupérer les trois boutons.
            2. Récupérer le compteur.
            3. Créer une variable qui commence à 0.
            4. Au clic sur +, augmenter de 1.
            5. Au clic sur -, diminuer de 1.
            6. Au clic sur Reset, remettre à 0.
            7. Afficher la valeur dans le DOM.
            8. Si la valeur est positive, ajouter la classe positif.
            9. Si elle est négative, ajouter la classe negatif.
            10. Si elle vaut 0, retirer les deux classes.
        */

        let btnMoins = document.querySelector("#moins")
        let btnReset = document.querySelector("#reset")
        let btnPlus = document.querySelector("#plus")
        let affichage = document.querySelector("#compteur")
        let cmpt = 0

        btnMoins.addEventListener("click",function(){
            cmpt = cmpt - 1
            actualiserCompteur()
        })

        btnReset.addEventListener("click",function(){
            cmpt = 0
            actualiserCompteur()
        })

        btnPlus.addEventListener("click",function(){
            cmpt = cmpt +1
            actualiserCompteur()
        })

        function actualiserCompteur(){
            affichage.textContent = cmpt

            if(cmpt > 0){
                affichage.classList.add("positif")
                affichage.classList.remove("negatif")
            }else if(cmpt < 0){
                affichage.classList.add("negatif");
                affichage.classList.remove("positif");
            }else{
                affichage.classList.remove("negatif");
                affichage.classList.remove("positif");
            }
        }

    </script>

</body>
</html>
