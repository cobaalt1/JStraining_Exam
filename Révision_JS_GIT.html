    <script>
        // Déclaration de l'âge
        const age = 29;

        // Vérification de l'âge

            // Si l'âge est supérieur ou égal à 18
            console.log("Majeur");

        } else {

            // Si l'âge est inférieur à 18
            console.log("Mineur");

        }
    </script>
