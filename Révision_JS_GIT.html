<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 13</title>

    <style>
        .active {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <p id="message">Bonjour !</p>

    <button id="bouton">Modifier le message</button>

    <script>
        // Sélection des éléments HTML
        const msg = document.querySelector("#message");
        const btn = document.querySelector("#bouton");

        // Écoute du clic sur le bouton
        btn.addEventListener("click", function() {

            // Modifie le texte du paragraphe
            msg.textContent = "Bienvenue !";

            // Ajoute ou retire la classe CSS "active"
            msg.classList.toggle("active");

        });
    </script>

</body>
</html>
