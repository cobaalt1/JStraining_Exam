
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic JS - Question 1</title>
</head>
<body>

    <!--
        DIAGNOSTIC - QUESTION 1

        1. Sélectionner le champ de saisie.
        2. Sélectionner le paragraphe résultat.
        3. Écouter l'événement input.
        4. Récupérer le texte saisi.
        5. Afficher sa longueur et sa version en majuscules.
    -->

    <input type="text" id="saisie" placeholder="Écris quelque chose">
    <p id="resultat"></p>

    <script>
        const saisie = document.querySelector("#saisie")
        const result = document.querySelector("#resultat")

        saisie.addEventListener("input",function(){
            const texteMajuscule = saisie.value.toUpperCase()
            result.textContent = saisie.value.length + " " + texteMajuscule
        });
    </script>
</body>
</html>
