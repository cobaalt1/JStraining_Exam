<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 17</title>
</head>
<body>

    <input id="prenom" type="text" placeholder="Ton prénom">

    <button id="valider">Valider</button>

    <p id="resultat"></p>

    <script>
        // Sélection des éléments HTML
        const prenom = document.querySelector("#prenom");
        const valider = document.querySelector("#valider");
        const resultat = document.querySelector("#resultat");

        // Écoute du clic sur le bouton
        valider.addEventListener("click", function() {

            // Récupère le prénom saisi et l'affiche dans le paragraphe
            resultat.textContent = prenom.value;

        });
    </script>

</body>
</html>
