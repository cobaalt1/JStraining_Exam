<body>

    <h1>Parcourir un tableau avec forEach()</h1>

    <p>Ouvre la console pour voir les résultats.</p>

    <script>
        const tabPrenom = ["Maxence","Lucas","Thomas","Julie"]

        tabPrenom.forEach(prenom => {
            console.log(prenom)
        });
    </script>

</body>
