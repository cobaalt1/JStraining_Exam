<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 12</title>

    <style>
        /* Cache l'élément lorsqu'il possède cette classe */
        .cache {
            display: none;
        }
    </style>
</head>
<body>

    <p id="message" class="cache">Bonjour !</p>

    <button id="afficher">Afficher le message</button>

    <script>
        // Sélection des éléments HTML
        const btn = document.querySelector("#afficher");
        const msg = document.querySelector("#message");

        // Écoute du clic sur le bouton
        btn.addEventListener("click", function() {

            // Ajoute ou retire la classe "cache"
            msg.classList.toggle("cache");

        });
    </script>

</body>
</html>
