
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prépa examen - 9</title>
</head>
<body>

    <!--
        PRÉPA EXAMEN - 9

        Objectif : créer une fonction avec paramètres et return.

        1. Sélectionner le bouton #calculer.
        2. Sélectionner le paragraphe #resultat.
        3. Créer une fonction appelée calculerPrix.
        4. Cette fonction reçoit deux paramètres :
           prixHT et tauxTVA.
        5. Calculer le prix TTC.
        6. Retourner le résultat avec return.
        7. Au clic sur le bouton, appeler la fonction
           avec les valeurs 100 et 0.21.
        8. Afficher le résultat dans le paragraphe.
    -->

    <h1>Calcul du prix TTC</h1>

    <button id="calculer">Calculer</button>
    <p id="resultat"></p>

    <script>
        const btn = document.querySelector("#calculer")
        const resultat = document.querySelector("#resultat")

        calculerPrix = function(prixHT,tauxTVA){
            const prixTTC = prixHT * (1 + tauxTVA)
            return prixTTC
        }

        btn.addEventListener("click",function(){
            const PrixTTC = calculerPrix(100, 0.21)
            resultat.textContent = PrixTTC
        })

    </script>

</body>
</html>
