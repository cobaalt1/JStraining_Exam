
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprendre les événements</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        button {
            padding: 15px 25px;
            margin: 10px;
            cursor: pointer;
        }

        #resultat {
            margin-top: 30px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <h1>Comprendre les événements</h1>

    <button id="bouton1" class="btn">Bouton 1</button>
    <button id="bouton2" class="btn">Bouton 2</button>
    <button id="bouton3" class="btn">Bouton 3</button>

    <p id="resultat">Clique sur un bouton.</p>

    <script>
        /*
            EXERCICE 34 - COMPRENDRE L'OBJET EVENT

            1. Récupérer tous les boutons.
            2. Récupérer le paragraphe resultat.
            3. Parcourir les boutons avec forEach().
            4. Ajouter un événement "click" sur chaque bouton.
            5. Récupérer le paramètre event dans la fonction.
            6. Afficher dans le paragraphe :
               - Le type d'événement déclenché.
               - L'identifiant du bouton cliqué.

            ATTENTION :
            - event est un objet.
            - event.type est une propriété.
            - event.target est l'élément qui a déclenché l'événement.
        */

        let btn = document.querySelectorAll(".btn")
        let result = document.querySelector("#resultat")

        btn.forEach(item => {
            item.addEventListener("click",function(event){
                result.textContent = [
                    event.type,
                    event.target,
                    event.target.id
                ]
            })
        });

    </script>

</body>
</html>
