<!-- Objectif
Apprendre à récupérer la longueur d'une chaîne et à modifier sa casse.

Consignes :
1. Déclare une constante phrase contenant : "JavaScript est un langage puissant".
2. Affiche le nombre de caractères avec .length.
3. Affiche la phrase en majuscules avec .toUpperCase().
4. Affiche la phrase en minuscules avec .toLowerCase(). -->

<body>

    <h1>Manipulation des chaînes de caractères</h1>

    <p>Ouvre la console pour voir les résultats.</p>

    <script>

        const phrase = "JavaScript est un langage puissant"

        console.log(phrase.length,phrase.toUpperCase(),phrase.toLowerCase())

    </script>

</body>
