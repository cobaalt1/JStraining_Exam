
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prépa examen - Exercice 5</title>
</head>
<body>

    <!--
        EXERCICE 5 - Parcourir un tableau avec forEach()

        Objectif :
        - Créer un tableau contenant les nombres 2, 4, 6, 8 et 10.
        - Sélectionner le bouton et le paragraphe avec querySelector().
        - Au clic sur le bouton, parcourir le tableau avec forEach().
        - Afficher chaque nombre dans le paragraphe.
        - Éviter que les nombres s'accumulent lorsqu'on clique plusieurs fois.

        Contrainte :
        - Utiliser obligatoirement forEach().
    -->

    <h1>Parcourir un tableau</h1>

    <button id="afficher">Afficher les nombres</button>
    <p id="resultat"></p>

    <script>
        const tab = [2,4,6,8,10]
        const btn = document.querySelector("#afficher")
        const result = document.querySelector("#resultat")

        btn.addEventListener("click",function(){
            result.textContent = ""
            tab.forEach(nb => {
            result.textContent += nb
            });
        })
    </script>

</body>
</html>
