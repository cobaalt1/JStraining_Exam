<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 8</title>
</head>
<body>

    <button id="Monbouton">Clique-moi</button>

    <script>
        // Sélectionne le bouton grâce à son identifiant
        const bouton = document.querySelector("#Monbouton");

        // Écoute l'événement de clic sur le bouton
        bouton.addEventListener("click", function() {

            // Affiche un message dans la console lors du clic
            console.log("Tu as cliqué sur le bouton");

        });
    </script>

</body>
</html>
