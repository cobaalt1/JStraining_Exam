
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 28 - Event</title>
</head>

<!-- Objectif : apprendre à récupérer des informations sur un événement JavaScript.

Consignes :
1. Sélectionne le bouton avec querySelector().
2. Ajoute un écouteur d'événement sur le clic avec addEventListener().
3. Récupère le paramètre event dans ta fonction.
4. Affiche event.type dans la console.
5. Affiche event.target dans la console.

Attention :
- event.type indique le type d'événement.
- event.target désigne l'élément qui a déclenché l'événement. -->

<body>

    <h1>Découvrir les événements JavaScript</h1>

    <button id="monBouton">Clique-moi !</button>

    <p>Ouvre la console et clique sur le bouton.</p>

    <script>
        const btn = document.querySelector("#monBouton")

        btn.addEventListener("click", function(event){
            console.log(event.type)
            console.log(event.target)
        })
    </script>

</body>
</html>
