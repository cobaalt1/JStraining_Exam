
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 31</title>
</head>
<body>

    <!--
    EXERCICE 31 - dispatchEvent()

    Objectif : déclencher un événement click depuis JavaScript.

    1. Sélectionne le bouton avec querySelector().
    2. Ajoute un écouteur d'événement "click".
    3. Dans la fonction, affiche "Événement déclenché !" dans la console.
    4. En dehors de l'écouteur, déclenche manuellement
       un événement click sur le bouton avec dispatchEvent().

    Indice :
    new Event("click")
    dispatchEvent()
    
    Attention : tu ne dois pas cliquer manuellement sur le bouton.
    JavaScript doit déclencher le clic tout seul !
    -->

    <h1>Déclenchement d'événement</h1>

    <button id="monBouton">Clique-moi !</button>

    <script>
        const btn = document.querySelector("#monBouton")
        const click = new Event("click")

        btn.addEventListener("click",function(){
            console.log("Événement déclenché !")
        })

        setTimeout(function(){
            btn.dispatchEvent(click);
        }, 3000);
    </script>

</body>
</html>
