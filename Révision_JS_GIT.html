<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prépa examen - Exercice 4</title>
</head>
<body>

    <h1>Calculer un prix TTC</h1>

    <button id="calculer">Calculer</button>

    <p id="resultat"></p>

    <!--
        Objectif :
        Calculer le prix TTC d'un article.

        Données :
        - Prix HT : 100 €
        - Taux de TVA : 21 %

        Contraintes :
        - Créer une fonction calculerTTC(prixHT, tauxTVA)
        - Effectuer le calcul dans la fonction
        - Utiliser return pour renvoyer le résultat
        - Appeler la fonction au clic sur le bouton
        - Afficher le résultat dans le paragraphe

        Formule :
        Prix TTC = Prix HT * (1 + taux TVA / 100)
    -->

    <script>
        const prixHT = 699.99
        const TVA = 21/100
        const btn = document.querySelector("#calculer")
        const txt = document.querySelector("#resultat")

        function calculerTTC(prixHT, tauxTVA) {
            let PriceTVA = prixHT * tauxTVA
            let resultat = prixHT + PriceTVA

            return resultat
        }

        btn.addEventListener("click",function(){
            const total = calculerTTC(prixHT, TVA)

            txt.textContent = total.toFixed(2) + " €"
        })
    </script>

</body>
</html>
