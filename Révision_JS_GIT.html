<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 11</title>

    <style>
        .active {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <p id="message">Bonjour !</p>

    <button id="ajouter">Ajouter la classe</button>
    <button id="supprimer">Supprimer la classe</button>

    <script>
        // Sélection des éléments HTML
        const msg = document.querySelector("#message");
        const ajouter = document.querySelector("#ajouter");
        const supprimer = document.querySelector("#supprimer");

        // Ajoute la classe CSS au clic
        ajouter.addEventListener("click", function() {
            msg.classList.add("active");
        });

        // Supprime la classe CSS au clic
        supprimer.addEventListener("click", function() {
            msg.classList.remove("active");
        });
    </script>

</body>
</html>
