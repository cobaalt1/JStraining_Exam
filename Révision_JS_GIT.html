<!-- Objectif : apprendre à remplacer du texte dans une chaîne de caractères avec replace().

Consignes :
1. Déclare une constante phrase contenant : "J'apprends PHP et PHP est intéressant".
2. Utilise replace() pour remplacer la première occurrence de "PHP" par "JavaScript".
3. Affiche le résultat dans la console.
4. Affiche également la phrase originale dans la console.

Attention : replace() retourne une nouvelle chaîne de caractères. Il ne modifie pas la chaîne originale. -->

<body>

    <h1>Remplacer du texte avec replace()</h1>

    <p>Ouvre la console pour voir les résultats.</p>

    <script>
        const phrase = "J'apprends PHP et PHP est intéressant"

        console.log(phrase)
        console.log(phrase.replace("PHP", "JavaScript"))
    </script>

</body>
