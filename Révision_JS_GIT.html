<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 9</title>
</head>
<body>

    <h1 id="title">Mon titre</h1>

    <p id="paragraphe">Voici un paragraphe.</p>

    <button id="Monbouton">Modifier le contenu</button>

    <script>
        // Sélection des éléments HTML
        const titre = document.querySelector("#title");
        const msg = document.querySelector("#paragraphe");
        const btn = document.querySelector("#Monbouton");

        // Écoute du clic sur le bouton
        btn.addEventListener("click", function() {

            // Modification du texte du paragraphe
            msg.textContent = "Le texte a été modifié !";

            // Modification de la couleur du titre
            titre.style.color = "red";

        });
    </script>

</body>
</html>
