
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prépa examen - 7</title>
</head>
<body>

    <!--
        PRÉPA EXAMEN - 7

        Objectif : parcourir un tableau et filtrer des valeurs.

        1. Sélectionner le paragraphe #resultat.
        2. Créer un tableau contenant :
           12, 5, 28, 9, 17, 3, 42.
        3. Parcourir le tableau avec forEach().
        4. Vérifier si chaque nombre est pair.
        5. Afficher uniquement les nombres pairs dans le paragraphe.
    -->

    <h1>Nombres pairs</h1>
    <p id="resultat"></p>

    <script>
        const resultat = document.querySelector("#resultat")
        const tab = [12, 5, 28, 9, 17, 3, 42]

        tab.forEach(number => {
            if(number % 2 === 0){
                resultat.textContent += number + " "
            }
        });
    </script>

</body>
</html>
