<!-- Objectif : apprendre à extraire une partie d'une chaîne de caractères avec slice().

Consignes :
1. Déclare une constante phrase contenant : "JavaScript est vraiment intéressant".
2. Utilise slice() pour récupérer uniquement le mot "JavaScript".
3. Affiche le résultat dans la console.
4. Utilise une deuxième fois slice() pour récupérer le mot "intéressant".
Attention : slice(debut, fin) commence à l'index de début et s'arrête juste avant l'index de fin. -->

<body>

    <h1>Extraire du texte avec slice()</h1>

    <p>Ouvre la console pour voir les résultats.</p>

    <script>
        const phrase = "JavaScript est vraiment intéressant"
        console.log(phrase)

        console.log(phrase.slice(0,10))
        console.log(phrase.slice(24,36))
    </script>

</body>
