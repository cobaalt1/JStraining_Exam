<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 1 - Miroir de texte</title>
</head>
<body>

    <h1>Miroir de texte</h1>

    <input type="text" id="saisie" placeholder="Écris quelque chose...">

    <p id="resultat"></p>

    <script>

    const input = document.querySelector("#saisie")
    const txt = document.querySelector("#resultat")

    input.addEventListener("input",function(){
        txt.textContent = input.value
    });

        /*
        EXERCICE 1 - MIROIR DE TEXTE

        Objectif :
        Afficher instantanément dans un paragraphe
        le texte saisi par l'utilisateur.

        Consignes :

        1. Récupérer le champ de saisie grâce à son ID.
        2. Récupérer le paragraphe grâce à son ID.
        3. Détecter lorsque l'utilisateur écrit dans le champ.
        4. Récupérer le contenu saisi par l'utilisateur.
        5. Afficher ce contenu dans le paragraphe.

        Contraintes :
        - Utiliser un événement JavaScript adapté.
        - Utiliser les méthodes DOM appropriées.
        - Ne pas utiliser onclick dans le HTML.
        */

    </script>

</body>
</html>
