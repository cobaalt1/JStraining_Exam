<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 25 - String includes</title>
</head>

<body>

    <h1>Rechercher du texte avec includes()</h1>

    <p id="phrase">J'apprends JavaScript et PHP avec plaisir</p>

    <p>Ouvre la console pour voir les résultats.</p>

    <script>
        const phrase = document.querySelector("#phrase");

        if (phrase.textContent.includes("JavaScript")) {
            console.log("La phrase contient le mot 'JavaScript'");
        } else {
            console.log("La phrase ne contient pas le mot recherché");
        }

        if (phrase.textContent.includes("PHP")) {
            console.log("La phrase contient le mot 'PHP'");
        } else {
            console.log("La phrase ne contient pas le mot recherché");
        }
    </script>

</body>
</html>
