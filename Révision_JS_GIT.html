<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 19</title>
</head>
<body>

    <p id="compteur">Nombre de clics : 0</p>

    <button id="incrementer">Clique-moi</button>

    <script>
        // Déclare une variable pour stocker le nombre de clics
        let i = 0;

        // Sélection des éléments HTML
        const cmpt = document.querySelector("#compteur");
        const btn = document.querySelector("#incrementer");

        // Écoute du clic sur le bouton
        btn.addEventListener("click", function() {

            // Incrémente le compteur de 1
            i = i + 1;

            // Actualise le texte affiché dans le paragraphe
            cmpt.textContent = "Nombre de clics : " + i;

        });
    </script>

</body>
</html>
