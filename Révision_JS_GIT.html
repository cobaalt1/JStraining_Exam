<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 32 - setInterval</title>
</head>
<body>

    <h1>Mon premier intervalle</h1>

    <p id="compteur">0</p>

    <!--
        EXERCICE 32 - setInterval()

        Objectif : apprendre à exécuter une fonction à intervalles réguliers.

        Consignes :
        1. Déclare une variable compteur initialisée à 0.
        2. Utilise setInterval() pour exécuter une fonction toutes les secondes (1000 ms).
        3. Incrémente compteur de 1 à chaque exécution.
        4. Affiche la nouvelle valeur dans le paragraphe HTML ayant l'ID "compteur".
        5. Lorsque le compteur atteint 10, arrête automatiquement l'intervalle avec clearInterval().

        Contraintes :
        - Utilise document.getElementById() pour récupérer le paragraphe.
        - Écris tout le JavaScript toi-même.
    -->

    <script>

        let cmpt = 0;
        const afficher = document.getElementById("compteur");

        const interval = setInterval(() => {

            if (cmpt >= 9) {
                afficher.textContent = "Nous sommes arrivés à 10, kurwa.";
                clearInterval(interval);
            }else{
            cmpt++;
            afficher.textContent = cmpt;
            }

        }, 1000);
    </script>

</body>
</html>
