<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision JavaScript - Exercice 16</title>
</head>
<body>

    <img id="photo" src="chat.jpg" alt="Un chat">

    <button id="changer">Changer la photo</button>

    <script>
        // Sélection des éléments HTML
        const img = document.querySelector("#photo");
        const btn = document.querySelector("#changer");

        // Écoute du clic sur le bouton
        btn.addEventListener("click", function() {

            // Modifie la source de l'image
            img.src = "chien.jpg";

        });
    </script>

</body>
</html>
